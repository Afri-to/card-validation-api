# Run the API and its database with one command:
#   docker compose up --build
# API docs: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cards
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cards"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cards
      CARD_FINGERPRINT_KEY: ${CARD_FINGERPRINT_KEY:-dev-only-change-me}
    ports:
      - "8000:8000"

volumes:
  pgdata:
