name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cards_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Smoke test the running container
        run: |
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent -X POST http://localhost:8000/transactions \
            -H "Content-Type: application/json" \
            -d '{"card_number": "4111 1111 1111 1111", "amount": "10.00", "currency": "USD"}' \
            | grep '"status":"approved"'
          curl --fail --silent "http://localhost:8000/transactions?status=approved" | grep '\*\*\*\* 1111'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
